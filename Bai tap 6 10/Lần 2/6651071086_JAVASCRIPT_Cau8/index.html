<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Câu 8 - Máy tính</title>
<link rel="stylesheet" href="Styles/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="Scripts/main.js" defer></script>
</head>
<body>
<div class="container">
<h1>Câu 8 - Máy tính đơn giản</h1>
<div>
<input type="number" id="num1" value="12">
<button class="op" data-op="+">+</button>
<button class="op" data-op="-">-</button>
<button class="op" data-op="*">×</button>
<button class="op" data-op="/">/</button>
<button class="op" data-op="^">^</button>
<input type="number" id="num2" value="14">
<span>=</span>
<input type="text" id="result" readonly>
</div>
<p>Biểu thức: 2 toán hạng + 1 toán tử. Có thể dùng chuột hoặc bàn phím.</p>
<div class="result" id="message"></div>
</div>
</body>
</html>
